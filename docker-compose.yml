services:
  postgres:
    image: postgres:16
    container_name: retailsync-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailsync}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_dev_password}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retailsync}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    container_name: retailsync-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.0
    container_name: retailsync-connect
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: retailsync-connect
      CONFIG_STORAGE_TOPIC: retailsync_connect_configs
      OFFSET_STORAGE_TOPIC: retailsync_connect_offsets
      STATUS_STORAGE_TOPIC: retailsync_connect_statuses

  simulator:
    profiles: ["simulator"]
    build: ./simulator
    container_name: retailsync-simulator
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-retailsync}
      DB_USER: ${POSTGRES_USER:-retail}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-retail_dev_password}
      EVENT_INTERVAL_SECONDS: 2

volumes:
  pgdata:
