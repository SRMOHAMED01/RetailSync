version: 2

models:
  - name: stg_orders
    description: "Staging view over retailsync.silver.orders (current order state)."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['CREATED', 'PAID', 'SHIPPED', 'DELIVERED', 'CANCELLED']
      - name: total_amount
        tests: [not_null]

  - name: stg_customers
    description: "Staging view over retailsync.silver.customers (current customer state)."
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null, unique]
      - name: first_name
        tests: [not_null]
      - name: last_name
        tests: [not_null]

  - name: stg_products
    description: "Staging view over retailsync.silver.products (current product state)."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: stock
        tests: [not_null]

  - name: stg_order_items
    description: "Staging view over retailsync.silver.order_items (current state)."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: unit_price
        tests: [not_null]

  - name: stg_payments
    description: "Staging view over retailsync.silver.payments (current state)."
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
      - name: amount
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['PENDING', 'PAID', 'FAILED', 'REFUNDED']