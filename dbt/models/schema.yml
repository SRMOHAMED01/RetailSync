version: 2

models:
  - name: stg_orders
    description: "Staging view over retailsync.silver.orders (current order state)."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['CREATED', 'PAID', 'SHIPPED', 'DELIVERED', 'CANCELLED']

  - name: dim_customer
    description: "Customer dimension (SCD Type 1)."
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null, unique]

  - name: dim_product
    description: "Product dimension."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: stock
        tests: [not_null]

  - name: dim_date
    description: "Date spine."
    columns:
      - name: date_id
        tests: [not_null, unique]

  - name: fact_sales
    description: "Sales fact, one row per order_item."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: unit_price
        tests: [not_null]

  - name: fact_orders
    description: "Order fact, one row per order."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: total_amount
        tests: [not_null]