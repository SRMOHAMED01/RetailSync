version: 2

models:
  - name: dim_customer
    description: "Customer dimension (SCD Type 1)."
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null, unique]

  - name: dim_product
    description: "Product dimension."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: stock
        tests: [not_null]

  - name: dim_date
    description: "Date spine."
    columns:
      - name: date_id
        tests: [not_null, unique]

  - name: fact_sales
    description: "Sales fact, one row per order_item."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: date_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: unit_price
        tests: [not_null]

  - name: fact_orders
    description: "Order fact, one row per order."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: total_amount
        tests: [not_null]

  - name: daily_sales
    description: "Daily sales rollup: orders, revenue, average basket per sales_date."
    columns:
      - name: sales_date
        tests: [not_null]
      - name: orders_count
        tests: [not_null]
      - name: revenue
        tests: [not_null]
      - name: avg_order_value
        tests: [not_null]